# trading_demo_ig_bot.yml
# Fichier de configuration centralisé pour le bot de trading IG (Mode Démo)

ig:
  IG_API_KEY: ${{ secrets.IG_DEMO_KEY }}
  IG_USERNAME: ${{ secrets.IG_ID_DEMO }}
  IG_PASSWORD: ${{ secrets.IG_PASSWORD_DEMO }}
  base_url: "https://demo-api.ig.com/gateway/deal"

trading:
  epic: "IX.D.DAX.OPTCALL.IP"
  DATE: "FEB-27"               # Échéance du produit barrière (ex: FEB-27)
  BARRIER: 25750               # Niveau de barrière actif pour l'ordre
  DEFAULT_BARRIERE: 25750      # Niveau de barrière par défaut / de référence
  size: 1.2                    # Taille du contrat (lots)
  direction: "BUY"             # Sens de l'opération (BUY pour Call/Bull, SELL pour Put/Bear)
