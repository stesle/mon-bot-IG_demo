#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""
IG DAX Barrier Option Bot - mode DEMO.

Stratégie :
  - Surveille le prix du DAX (UNDERLYING_EPIC).
  - Quand le DAX entre dans la zone de declenchement autour de la barriere
    (BARRIER_LEVEL=25750, largeur TRIGGER_DISTANCE), achete l'option call
    barriere BARRIER_EPIC.
  - Max MAX_DAILY_TRADES achats par jour (heure de Paris).
  - Stop journalier : si la perte cumulee du jour depasse DAILY_MAX_LOSS,
    plus aucun ordre jusqu'au lendemain.
  - Martingale optionnelle : le stake est multiplie par MARTINGALE_FACTOR
    apres chaque perte consecutive, remis a BASE_STAKE apres une gagne,
    plafonne par MARTINGALE_MAX_STEPS.

Le bot est "stateless" : tout l'etat (position ouverte, trades du jour,
resultats passes) est deduit depuis l'API IG. Cela permet de tourner sur
GitHub Actions, ou le disque est vide a chaque execution.

Modes :
  python bot/ig_bot.py --once          # un cycle (utilise avec le cron Actions)
  python bot/ig_bot.py --loop          # boucle locale, polling POLL_SECONDS
"""

from __future__ import annotations

import argparse
import logging
import os
import sys
import time
from datetime import datetime, timedelta, timezone
from zoneinfo import ZoneInfo

import requests

PARIS = ZoneInfo("Europe/Paris")
UTC = timezone.utc

log = logging.getLogger("ig-dax-bot")


# --------------------------------------------------------------------------
# Configuration (toutes les variables viennent de l'environnement)
# --------------------------------------------------------------------------

def env_str(name: str, default=None):
    v = os.environ.get(name)
    return v.strip() if v and v.strip() else default


def env_float(name: str, default: float) -> float:
    try:
        return float(env_str(name, default))
    except (TypeError, ValueError):
        return default


def env_int(name: str, default: int) -> int:
    try:
        return int(float(env_str(name, default)))
    except (TypeError, ValueError):
        return default


def env_bool(name: str, default: bool) -> bool:
    v = env_str(name)
    if v is None:
        return default
    return v.lower() in ("1", "true", "yes", "y", "on")


class Config:
    @classmethod
    def from_env(cls) -> "Config":
        cfg = cls()
        # Connexion IG (remplaces par les secrets GitHub Actions)
        cfg.ig_api_key = env_str("IG_DEMO_KEY")
        cfg.ig_username = env_str("IG_ID_DEMO")
        cfg.ig_password = env_str("IG_PASSWORD_DEMO")
        cfg.ig_base_url = env_str("IG_BASE_URL", "https://demo-api.ig.com/gateway/deal")

        # Marche surveille / negociation
        cfg.barrier_epic = env_str("BARRIER_EPIC", "IX.D.DAX.OPTCALL.IP")
        cfg.barrier_level = env_float("BARRIER_LEVEL", 25750.0)
        cfg.option_expiry = env_str("OPTION_EXPIRY")           # ex: "FEB-27"
        cfg.underlying_epic = env_str("UNDERLYING_EPIC", "IX.D.DAX.DAILY.IP")
        cfg.currency_code = env_str("CURRENCY_CODE", "EUR")

        # Declenchement
        cfg.trigger_distance = env_float("TRIGGER_DISTANCE", 100.0)
        cfg.trigger_side = env_str("TRIGGER_SIDE", "BELOW").upper()  # BELOW | AROUND | ABOVE

        # Fenetre de trading (heure de Paris)
        cfg.trading_window = env_str("TRADING_WINDOW", "09:00-17:30")
        cfg.allow_weekend = env_bool("ALLOW_WEEKEND", False)

        # Risque
        cfg.base_stake = env_float("BASE_STAKE", 1.0)
        cfg.max_daily_trades = env_int("MAX_DAILY_TRADES", 1)
        cfg.daily_max_loss = env_float("DAILY_MAX_LOSS", 25.0)
        cfg.stop_distance = env_float("STOP_DISTANCE", 0.0)    # 0 = pas de stop CFD

        # Martingale (plafonnee !)
        cfg.martingale_enabled = env_bool("MARTINGALE_ENABLED", True)
        cfg.martingale_factor = max(1.0, env_float("MARTINGALE_FACTOR", 2.0))
        cfg.martingale_max_steps = env_int("MARTINGALE_MAX_STEPS", 3)

        # Securite / divers
        cfg.dry_run = env_bool("DRY_RUN", True)
        cfg.poll_seconds = env_int("POLL_SECONDS", 120)

        return cfg


# --------------------------------------------------------------------------
# Client REST IG
# --------------------------------------------------------------------------

class IGRestError(RuntimeError):
    pass


class IGClient:
    def __init__(self, cfg: Config):
        self.cfg = cfg
        self.s = requests.Session()
        self.cst = None
        self.xst = None

    # --- interne -----------------------------------------------------------

    def _headers(self, version: str, with_body: bool = False) -> dict:
        h = {
            "X-IG-API-KEY": self.cfg.ig_api_key,
            "Accept": "application/json; charset=utf-8",
            "Version": version,
        }
        if with_body:
            h["Content-Type"] = "application/json; charset=utf-8"
        if self.cst:
            h["CST"] = self.cst
        if self.xst:
            h["X-SECURITY-TOKEN"] = self.xst
        return h

    def _req(self, method: str, path: str, *, version: str,
             params=None, body=None, _redirects: int = 0):
        url = self.cfg.ig_base_url + path
        last_err = None
        for attempt in range(3):
            try:
                resp = self.s.request(
                    method, url,
                    headers=self._headers(version, with_body=body is not None),
                    params=params,
                    json=body,
                    timeout=20,
                    allow_redirects=False,
                )
            except requests.RequestException as e:
                last_err = f"reseau: {e}"
                time.sleep(2 * (attempt + 1))
                continue

            # L'API IG renvoie parfois une 307 avec un Location a suivre.
            if resp.status_code in (301, 302, 307) and resp.headers.get("Location"):
                if _redirects >= 2:
                    raise IGRestError(f"{method} {path}: trop de redirections")
                loc = resp.headers["Location"]
                follow = loc if loc.startswith("http") else None
                return self._req(method, loc if not loc.startswith("http") else
                                 loc.split(self.cfg.ig_base_url)[-1],
                                 version=version, params=params, body=body,
                                 _redirects=_redirects + 1)

            if resp.status_code in (429,) or resp.status_code >= 500:
                last_err = f"HTTP {resp.status_code}: {resp.text[:200]}"
                time.sleep(2 * (attempt + 1))
                continue

            if 200 <= resp.status_code < 300:
                if not resp.text:
                    return {}
                try:
                    return resp.json()
                except ValueError:
                    return {"raw": resp.text}

            raise IGRestError(f"{method} {path} -> HTTP {resp.status_code}: {resp.text[:300]}")

        raise IGRestError(f"{method} {path}: abandon apres 3 essais ({last_err})")

    # --- public -------------------------------------------------------------

    def login(self):
        if not (self.cfg.ig_api_key and self.cfg.ig_username and self.cfg.ig_password):
            raise IGRestError("Credentials manquants : IG_API_KEY / IG_USERNAME / IG_PASSWORD")
        resp = self.s.post(
            self.cfg.ig_base_url + "/session",
            json={"identifier": self.cfg.ig_username, "password": self.cfg.ig_password},
            headers=self._headers("2", with_body=True),
            timeout=20,
        )
        if resp.status_code != 200:
            raise IGRestError(
                f"Login IG impossible (HTTP {resp.status_code}). Verifie les secrets "
                f"(IG_DEMO_KEY / IG_ID_DEMO / IG_PASSWORD_DEMO) et le compte DEMO : {resp.text[:200]}"
            )
        self.cst = resp.headers.get("CST")
        self.xst = resp.headers.get("X-SECURITY-TOKEN")
        if not self.cst:
            raise IGRestError("Login IG : jetons CST/X-SECURITY-TOKEN absents de la reponse.")
        try:
            info = resp.json()
            bal = (info.get("accountInfo") or {}).get("balance") or {}
            log.info("Login OK - solde %.2f %s (disponible %.2f)",
                     float(bal.get("balance") or 0), bal.get("currency", "?"),
                     float(bal.get("available") or 0))
        except (ValueError, TypeError):
            pass

    def logout(self):
        try:
            self._req("DELETE", "/session", version="1")
        except IGRestError:
            pass

    def get_market(self, epic: str, version: str = "3") -> dict:
        return self._req("GET", f"/markets/{epic}", version=version)

    def get_underlying_price(self, epic: str):
        # 1) essai via /prices (derniere bougie minute)
        try:
            data = self._req("GET", f"/prices/{epic}", version="3",
                             params={"resolution": "MINUTE", "n": "1"})
            candles = data.get("prices") or []
            if candles:
                close = candles[-1].get("closePrice") or {}
                vals = [close[k] for k in ("bid", "offer") if close.get(k) is not None]
                if vals:
                    return sum(vals) / len(vals)
        except IGRestError as e:
            log.warning("Prix via /prices indisponible (%s), essai via /markets", e)
        # 2) repli via snapshot du marche
        snap = self.get_market(epic).get("snapshot") or {}
        vals = [snap[k] for k in ("bid", "offer") if snap.get(k) is not None]
        return (sum(vals) / len(vals)) if vals else None

    def get_positions(self) -> dict:
        return self._req("GET", "/positions", version="2")

    def create_position(self, epic: str, direction: str, size: float,
                        currency: str, expiry=None, stop_distance=None) -> dict:
        body = {
            "epic": epic,
            "orderType": "MARKET",
            "direction": direction,
            "size": f"{size:g}",
            "currencyCode": currency,
            "forceOpen": True,
            "guaranteedStop": False,
        }
        if expiry:
            body["expiry"] = expiry
        if stop_distance:
            body["stopDistance"] = f"{stop_distance:g}"
        return self._req("POST", "/positions/otc", version="2", body=body)

    def confirm_deal(self, deal_reference: str, attempts: int = 6) -> dict:
        data = {}
        for i in range(attempts):
            data = self._req("GET", f"/confirms/{deal_reference}", version="1")
            if str(data.get("dealStatus", "")).upper() == "ACCEPTED":
                return data
            time.sleep(2)
        return data

    def get_recent_transactions(self, epic: str, instrument_hint: str,
                                days: int = 30, limit: int = 50) -> list:
        since = datetime.now(UTC) - timedelta(days=days)
        rows = None
        for version in ("1", "2"):
            try:
                data = self._req("GET", f"/history/transactions/ALL_DEAL/{limit}", version=version)
                rows = data.get("transactions")
                break
            except (IGRestError, ValueError) as e:
                log.debug("Historique transactions v%s indisponible : %s", version, e)
        if rows is None:
            log.warning("Historique des transactions indisponible : "
                        "martingale et stop journalier approximatifs sur ce cycle.")
            return []
        out = []
        for t in rows:
            ds = t.get("dateUtc") or t.get("date") or ""
            try:
                ts = datetime.fromisoformat(str(ds).replace("Z", "+00:00"))
            except ValueError:
                continue
            if ts.tzinfo is None:
                ts = ts.replace(tzinfo=UTC)
            if ts < since:
                continue
            known_epic = t.get("epic") == epic
            known_name = bool(instrument_hint) and instrument_hint.lower() in (t.get("instrumentName") or "").lower()
            if not (known_epic or known_name):
                continue
            try:
                pnl = float(t.get("profitAndLoss") or 0.0)
            except (TypeError, ValueError):
                pnl = 0.0
            out.append({"ts": ts, "pnl": pnl})
        return sorted(out, key=lambda d: d["ts"])


# --------------------------------------------------------------------------
# Logique de trading
# --------------------------------------------------------------------------

def parse_window(window: str):
    try:
        a, b = window.split("-")
        return a.strip(), b.strip()
    except ValueError:
        return None, None


def in_trading_window(cfg: Config, now: datetime) -> bool:
    if not cfg.allow_weekend and now.weekday() >= 5:
        return False
    start, end = parse_window(cfg.trading_window)
    if not start:
        return True
    hhmm = now.strftime("%H:%M")
    return start <= hhmm <= end


def _f(x, default=0.0) -> float:
    try:
        return float(x)
    except (TypeError, ValueError):
        return default


def triggered(cfg: Config, underlying_price: float, barrier: float) -> bool:
    low = barrier - cfg.trigger_distance
    high = barrier + cfg.trigger_distance
    if cfg.trigger_side == "BELOW":
        return low <= underlying_price <= barrier
    if cfg.trigger_side == "ABOVE":
        return barrier <= underlying_price <= high
    return low <= underlying_price <= high  # AROUND


def compute_stake(cfg: Config, history: list):
    """Stake avec martingale plafonnee, basee sur les trades recents de l'instrument."""
    if not cfg.martingale_enabled:
        return cfg.base_stake, 0
    losses = 0
    for h in reversed(history):  # du plus recent au plus ancien
        if h["pnl"] < 0:
            losses += 1
        else:
            break
    level = min(losses, cfg.martingale_max_steps)
    return round(cfg.base_stake * (cfg.martingale_factor ** level), 2), level


def clamp_to_dealing_rules(market: dict, stake: float) -> float:
    rules = (market.get("dealingRules") or {}).get("marketOrderSizeRange") or {}
    mn = _f((rules.get("min") or {}).get("value"), None)
    mx = _f((rules.get("max") or {}).get("value"), None)
    if mn is not None and stake < mn:
        log.info("Stake %g < minimum IG (%g) : ajuste a %g", stake, mn, mn)
        return mn
    if mx is not None and stake > mx:
        log.info("Stake %g > maximum IG (%g) : ajuste a %g", stake, mx, mx)
        return mx
    return stake


def run_once(cfg: Config) -> int:
    now = datetime.now(PARIS)
    if not in_trading_window(cfg, now):
        log.info("Hors fenetre de trading (%s) : now=%s Paris, rien a faire.",
                 cfg.trading_window, now.strftime("%H:%M"))
        return 0

    client = IGClient(cfg)
    client.login()
    try:
        market = client.get_market(cfg.barrier_epic)
        instrument = market.get("instrument") or {}
        snapshot = market.get("snapshot") or {}
        status = snapshot.get("marketStatus", "")
        name = instrument.get("name") or cfg.barrier_epic
        expiry = cfg.option_expiry if cfg.option_expiry else instrument.get("expiry")
        log.info("Option: %s (epic=%s, statut=%s, expiry=%s)",
                 name, cfg.barrier_epic, status, expiry)

        if status and str(status).upper() != "TRADEABLE":
            log.info("Marche non negociable (%s) : aucune action.", status)
            return 0

        price = client.get_underlying_price(cfg.underlying_epic)
        if price is None:
            log.warning("Prix du DAX indisponible (%s) : cycle sans action.",
                        cfg.underlying_epic)
            return 0
        log.info("DAX=%.1f | barriere=%.1f | zone de declenchement [%s]",
                 price, cfg.barrier_level,
                 {
                     "BELOW": f"{cfg.barrier_level - cfg.trigger_distance:.1f} ; {cfg.barrier_level:.1f}",
                     "ABOVE": f"{cfg.barrier_level:.1f} ; {cfg.barrier_level + cfg.trigger_distance:.1f}",
                     "AROUND": f"{cfg.barrier_level - cfg.trigger_distance:.1f} ; {cfg.barrier_level + cfg.trigger_distance:.1f}",
                 }[cfg.trigger_side])

        if not triggered(cfg, price, cfg.barrier_level):
            return 0

        # ---- positions ouvertes sur cet EPIC ?
        try:
            positions = (client.get_positions() or {}).get("positions") or []
        except IGRestError as e:
            log.warning("Lecture des positions impossible : %s", e)
            positions = []
        open_here = [p for p in positions if (p.get("market") or {}).get("epic") == cfg.barrier_epic]
        if open_here:
            log.info("Position deja ouverte sur l'option : aucune action.")
            return 0

        # ---- historique recent (etats + limites)
        history = client.get_recent_transactions(cfg.barrier_epic, name)
        today = now.date()
        today_txs = [h for h in history if h["ts"].astimezone(PARIS).date() == today]
        # les transactions comprennent ouverture (+ cloture) ; approx : 1 trade = 1 a 2 lignes
        trades_today = (len(today_txs) + 1) // 2
        if trades_today >= cfg.max_daily_trades:
            log.info("Limite journaliere deja atteinte (%d/%d trades) : aucune action.",
                     trades_today, cfg.max_daily_trades)
            return 0

        daily_loss = sum(min(0.0, h["pnl"]) for h in today_txs)
        if daily_loss <= -cfg.daily_max_loss:
            log.info("Stop journalier : perte du jour %.2f <= -%.2f. Aucun ordre.",
                     daily_loss, cfg.daily_max_loss)
            return 0

        stake, level = compute_stake(cfg, history)
        stake = clamp_to_dealing_rules(market, stake)
        log.info("Declenchement ! BUY %s | stake=%g (martingale niv. %d) | expiry=%s",
                 cfg.barrier_epic, stake, level, expiry)

        if cfg.dry_run:
            log.info("DRY RUN=True : ordre NON envoye. Passe DRY_RUN=false pour negocier reellement.")
            return 0

        ref = client.create_position(
            cfg.barrier_epic, "BUY", stake, cfg.currency_code,
            expiry, cfg.stop_distance or None,
        )
        deal_ref = ref.get("dealReference")
        if not deal_ref:
            log.error("Pas de dealReference dans la reponse : %s", ref)
            return 1
        confirm = client.confirm_deal(deal_ref)
        log.info("Ordre CONFIRME : status=%s dealId=%s affectes=%s level=%s profit=%s",
                 confirm.get("dealStatus"), confirm.get("dealId"),
                 [d.get("dealId") for d in (confirm.get("affectedDeals") or [])],
                 confirm.get("level"), confirm.get("profit"))
        if str(confirm.get("dealStatus", "")).upper() != "ACCEPTED":
            log.warning("L'ordre n'a pas ete accepte : %s", confirm)
            return 1
        return 0
    finally:
        client.logout()


def main() -> int:
    logging.basicConfig(level=logging.INFO,
                        format="%(asctime)s %(levelname)-7s %(message)s")
    parser = argparse.ArgumentParser(description="IG DAX barrier-option demo bot")
    mode = parser.add_mutually_exclusive_group(required=True)
    mode.add_argument("--once", action="store_true", help="un seul cycle (cron)")
    mode.add_argument("--loop", action="store_true", help="boucle continue locale")
    args = parser.parse_args()

    cfg = Config.from_env()
    if cfg.dry_run:
        log.info("*** MODE DRY RUN : aucun ordre sera envoye ***")

    if args.once:
        try:
            return run_once(cfg)
        except Exception:
            log.exception("Erreur fatale du cycle")
            return 1

    log.info("Boucle continue (poll=%ss). Ctrl-C pour arreter.", cfg.poll_seconds)
    while True:
        try:
            run_once(cfg)
        except Exception:
            log.exception("Cycle en erreur, nouvelle tentative apres le prochain poll")
        time.sleep(cfg.poll_seconds)


if __name__ == "__main__":
    sys.exit(main())
