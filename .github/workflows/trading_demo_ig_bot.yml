import os
import sys
from trading_ig import IGService
from trading_ig.rest import IGException

def main():
    # 1. Récupération sécurisée des identifiants (Secrets GitHub)
    username = os.environ.get("IG_USERNAME")
    password = os.environ.get("IG_PASSWORD")
    api_key = os.environ.get("IG_API_KEY")

    if not username or not password or not api_key:
        print("Erreur : Les identifiants IG sont manquants dans les variables d'environnement.")
        sys.exit(1)

    print("Connexion à l'API IG (Compte DEMO) pour les Produits Barrières...")

    # 2. Initialisation de la session
    ig_service = IGService(
        username=username,
        password=password,
        api_key=api_key,
        acc_type="DEMO"
    )

    try:
        ig_service.create_session()
        print("Connexion établie avec succès.")

        # 3. Paramétrage du Produit Barrière
        # ATTENTION : Remplacez cet EPIC par l'EPIC exact d'un produit barrière 
        # que vous aurez récupéré depuis votre plateforme IG (ex: DAX ou EUR/USD Knock-Out).
        # L'EPIC d'un produit barrière contient généralement des indications de prix/barrière.
        epic_barriere = "KA.D.DAX.C.IP"  # Exemple fictif d'un produit barrière (Call)
        
        taille_lot = 1.0  # Taille minimale de la position

        print(f"Tentative d'ouverture d'une position sur le produit barrière : {epic_barriere}")

        # 4. Passage d'un ordre d'achat sur le produit barrière
        # Sur les produits barrières, la barrière de protection fait partie intégrante du contrat.
        response = ig_service.create_open_position(
            currency_code="EUR",
            direction="BUY",          # "BUY" pour anticiper une hausse (Call) / "SELL" pour une baisse (Put)
            epic=epic_barriere,
            expiry="DF",              # Daily Financed (ou échéance spécifique du barrière)
            force_open=True,
            guaranteed_stop=True,     # Requis ou inhérent aux barrières
            level=None,               # None pour une exécution immédiate au prix du marché
            limit_level=None,
            order_type="MARKET",
            quote_id=None,
            size=taille_lot,
            stop_level=None,          # La barrière gère le risque maximum
            time_in_force="FILL_OR_KILL"
        )

        print(f"Ordre barrière exécuté avec succès ! Détails : {response}")

    except IGException as e:
        print(f"Erreur API IG lors du passage d'ordre barrière : {e}")
        sys.exit(1)
    except Exception as e:
        print(f"Une erreur inattendue est survenue : {e}")
        sys.exit(1)

if __name__ == "__main__":
    main()
