name: IG Trading Bot

on:
  # Planification : Exécute le bot automatiquement du lundi au vendredi
  # (par exemple toutes les heures à la minute 0)
  schedule:
    - cron: '0 * * * 1-5'

  # Permet aussi de lancer le bot manuellement depuis l'onglet "Actions" de GitHub
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer le script de trading
        env:
          IG_USERNAME: ${{ secrets.IG_ID_DEMO }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD_DEMO }}
          IG_API_KEY: ${{ secrets.IG_DEMO_KEY }}
        run: |
          python bot.py
